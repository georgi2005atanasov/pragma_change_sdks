name: Verify reference clients
on: [push, pull_request]
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: python scripts/check-contract.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python -m unittest discover -s scripts/tests
      - run: node --test node/test.mjs node/recording.test.mjs
      - run: dotnet build csharp/PragmaChange.csproj
      - run: python scripts/test-sdk-parity.py
      - run: python scripts/test-sdk-recordings.py
